<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a1446" />
<meta name="robots" content="noindex" />
<title>Своя игра — игрок</title>
<link rel="stylesheet" href="style.css" />
<style>
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; font-size: 18px; user-select: none; -webkit-user-select: none; }
  .form { margin: auto; width: 100%; max-width: 420px; padding: 24px 18px; text-align: center; }
  .form h1 { color: var(--gold); font-size: 34px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .form input { font-size: 24px; text-align: center; margin: 14px 0; user-select: text; -webkit-user-select: text; }
  .form button { width: 100%; font-size: 24px; padding: 16px; }
  .top { display: flex; align-items: center; gap: 10px; padding: calc(8px + env(safe-area-inset-top)) 14px 8px; background: #06103a; }
  .top .nm { flex: 1; font-weight: 700; font-size: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top .sc { color: var(--gold); font-weight: 800; font-size: 30px; }
  .info { text-align: center; padding: 4px 12px; font-size: 16px; color: var(--muted); }
  .info:empty { display: none; }
  .strip { display: flex; gap: 6px; overflow-x: auto; padding: 6px 10px; background: #081245; scrollbar-width: none; }
  .strip .c { flex: 0 0 auto; padding: 2px 10px; border-radius: 8px; background: var(--bg2); border: 2px solid #2b3fa0; font-size: 13px; text-align: center; line-height: 1.2; }
  .strip .c b { display: block; color: var(--gold); font-size: 16px; }
  .strip .c.me { border-color: var(--gold2); }
  .strip .c.first { background: var(--gold); color: #1b1b1b; } .strip .c.first b { color: #1b1b1b; }
  .strip .c.wrong { border-color: var(--red); opacity: 0.7; }
  .strip .c.off { opacity: 0.45; }
  #view { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; text-align: center; user-select: text; -webkit-user-select: text; }
  #view > .mid { margin: auto 0; }
  #view .board { font-size: 11px; grid-template-columns: minmax(70px, 1.6fr) repeat(5, 1fr); gap: 3px; padding: 3px; }
  #view .board .theme { font-size: 10px; min-height: 34px; padding: 3px 4px; overflow-wrap: anywhere; }
  #view .board .cell { font-size: 15px; min-height: 34px; padding: 2px; }
  #view .qh { color: var(--gold); font-weight: 800; text-transform: uppercase; font-size: 15px; letter-spacing: 0.03em; }
  #view .qt { font-size: 22px; line-height: 1.3; font-weight: 700; margin: 8px 0; }
  #view .ans { font-size: 19px; background: #0b5d2a; border: 2px solid var(--green); border-radius: 10px; padding: 8px; margin-top: 8px; }
  #view .ans b { color: #b9ffcf; }
  #view .who { font-size: 28px; color: var(--gold); font-weight: 900; }
  #view .lbl { font-size: 13px; color: var(--muted); text-transform: uppercase; margin-top: 8px; }
  #view .ord { font-size: 15px; color: var(--muted); }
  #view .big { font-size: 24px; font-weight: 700; }
  #view .qimg { display: block; margin: 6px auto; max-width: 100%; max-height: 32vh; border-radius: 10px; }
  #view .sp-title { font-size: 30px; margin: 4px 0; }
  .wrap { flex: 0 0 auto; height: 36vh; min-height: 150px; display: flex; padding: 0 12px calc(12px + env(safe-area-inset-bottom)); }
  #btn {
    flex: 1; border-radius: 28px; font-size: 11vw; font-weight: 900; line-height: 1.1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: var(--grey); color: #cfd5ea; border: 6px solid rgba(255,255,255,0.15);
    touch-action: manipulation; padding: 10px; text-transform: uppercase;
    transition: background 0.08s, transform 0.05s;
  }
  #btn:hover { background: var(--grey); }
  #btn small { font-size: 4.6vw; font-weight: 700; text-transform: none; }
  #btn.green { background: var(--green); color: #fff; border-color: #8dffb9; box-shadow: 0 0 40px rgba(31,191,91,0.6); }
  #btn.green:active { transform: scale(0.97); }
  #btn.red { background: var(--red); color: #fff; }
  #btn.gold { background: var(--gold); color: #1b1b1b; border-color: #fff; }
  #btn.wait { background: #3d5ad8; color: #fff; }
  @media (min-width: 700px) { #btn { font-size: 64px; } #btn small { font-size: 26px; } #view .qt { font-size: 30px; } #view .board { font-size: 15px; } #view .board .cell { font-size: 24px; } #view .board .theme { font-size: 14px; } }
  .timerbar { margin: 0 12px 8px; }
  .final { flex: 1; overflow: auto; padding: 8px 16px 20px; text-align: center; user-select: text; -webkit-user-select: text; }
  .final h2 { color: var(--gold); margin: 10px 0; font-size: 28px; }
  .final .q { font-size: 24px; line-height: 1.3; margin: 10px 0 16px; }
  .final input, .final textarea { font-size: 24px; text-align: center; margin-bottom: 10px; }
  .final textarea { min-height: 90px; }
  .final button { width: 100%; font-size: 22px; padding: 16px; margin-top: 6px; }
  .note { color: var(--muted); margin-top: 10px; }
</style>
</head>
<body>
  <div id="vCode" class="form hidden">
    <h1>Своя игра</h1>
    <p>Введите код комнаты — его скажет ведущий:</p>
    <input id="inCode" inputmode="numeric" maxlength="4" placeholder="1234" autocomplete="off" />
    <button class="gold" id="goCode">Дальше</button>
  </div>

  <div id="vName" class="form hidden">
    <h1>Своя игра</h1>
    <p id="kickedMsg" class="hidden" style="color:#ffb3b0">Ведущий удалил вас из игры. Можно войти заново.</p>
    <p>Комната <b class="gold-text" id="nameRoom"></b>. Как вас зовут?</p>
    <input id="inName" maxlength="24" placeholder="Ваше имя" autocomplete="off" />
    <button class="gold" id="goName">Играть</button>
  </div>

  <div id="vGame" class="hidden" style="display:flex;flex-direction:column;height:100%">
    <div class="top"><span class="dot" id="dot"></span><span class="nm" id="myName"></span><span class="sc" id="myScore">0</span></div>
    <div class="strip" id="strip"></div>
    <div class="info" id="info"></div>
    <div id="view"></div>
    <div class="timerbar hidden" id="tbar"><div id="tfill"></div></div>
    <div class="wrap" id="btnWrap"><button id="btn">…</button></div>
    <div class="final hidden" id="final"></div>
  </div>

<script src="lib/supabase.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
'use strict';
const { $, esc, store } = SV;
// в тестовом режиме можно открыть несколько игроков в одном браузере: play.html?room=…&local=1&slot=2
const ME_KEY = 'svoya_player' + (SV.local ? '_local' + (SV.params.get('slot') || '') : '');
let room = SV.roomFromUrl();
let me = store.get(ME_KEY, null); // {room, id, name}
let conn = null, st = null, mePlayer = null;
let falseUntil = 0, pressedRound = -1, timerEnd = 0, finalKey = '', myBet = null;
let helloTimer = null, lastAt = 0;

function show(v) { ['#vCode', '#vName', '#vGame'].forEach((s) => $(s).classList.toggle('hidden', s !== v)); }

// ----- вход -----
if (!room) {
  show('#vCode');
  $('#goCode').onclick = () => {
    const c = $('#inCode').value.replace(/\D/g, '');
    if (c.length !== 4) return;
    location.href = SV.pageUrl('play.html', c);
  };
} else if (me && me.room === room && me.id && me.name) {
  start();
} else {
  askName();
}
function askName(kicked) {
  show('#vName');
  $('#nameRoom').textContent = room;
  $('#kickedMsg').classList.toggle('hidden', !kicked);
  if (me && me.name) $('#inName').value = me.name;
  const go = () => {
    const name = $('#inName').value.trim().replace(/\s+/g, ' ').slice(0, 24);
    if (!name) { $('#inName').focus(); return; }
    me = { room, id: !kicked && me && me.room === room && me.id ? me.id : SV.uid(), name };
    store.set(ME_KEY, me);
    if (kicked) { location.reload(); return; }
    start();
  };
  $('#goName').onclick = go;
  $('#inName').onkeydown = (e) => { if (e.key === 'Enter') go(); };
}

function hello() { if (conn) { conn.send({ t: 'hello', id: me.id, name: me.name }); } }

function start() {
  show('#vGame');
  $('#vGame').style.display = 'flex';
  $('#myName').textContent = me.name;
  render();
  conn = SV.connect(room, {
    key: me.id,
    meta: { role: 'player', pid: me.id },
    onMsg,
    onStatus(s) {
      $('#dot').classList.toggle('on', s === 'ok');
      if (s === 'ok') hello();
      else $('#info').textContent = SV.statusText(s);
    },
  });
  // пока ведущий нас не увидел — повторяем «привет»
  helloTimer = setInterval(() => { if (!mePlayer) hello(); }, 2000);
  // пульт шлёт состояние каждые 4 с; тишина 12 с — значит связи нет
  setInterval(() => { if (lastAt && Date.now() - lastAt > 12000) $('#info').textContent = 'Нет связи с ведущим… проверьте интернет'; else if (lastAt && $('#info').textContent.startsWith('Нет связи')) $('#info').textContent = ''; }, 2000);
  SV.keepAwake();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) hello(); });
}

function onMsg(m) {
  if (!m) return;
  if (m.t === 'kicked' && m.id === me.id) {
    store.set(ME_KEY, { room, name: me.name });
    conn = null; clearInterval(helloTimer);
    askName(true);
    return;
  }
  if (m.t === 'img') { SV.imgCache[m.key] = m.data; if (st && mePlayer) render(); return; }
  if (m.t !== 'state' || m.room !== room) return;
  lastAt = Date.now();
  const prev = st;
  st = m;
  const wasMe = mePlayer;
  mePlayer = st.players.find((p) => p.id === me.id) || null;
  if (!mePlayer && wasMe) hello();
  if (st.phase === 'open' && st.timerLeft != null) timerEnd = Date.now() + st.timerLeft;
  if (st.phase !== 'open' && st.phase !== 'answering') pressedRound = -1;
  // вибрация, если ответить выпало мне
  if (st.phase === 'answering' && st.buzz[0] && st.buzz[0].id === me.id && !(prev && prev.phase === 'answering' && prev.round === st.round)) {
    if (navigator.vibrate) navigator.vibrate([80, 40, 80]);
  }
  render();
}

// ----- главная кнопка -----
function press(e) {
  if (e) e.preventDefault();
  if (!st || !mePlayer) return;
  const now = Date.now();
  if (now < falseUntil) return;
  if (st.phase === 'question') {
    // фальстарт: нажал до «Принимаю ответы»
    falseUntil = now + SV.FALSE_START_MS;
    if (navigator.vibrate) navigator.vibrate(300);
    render();
    setTimeout(render, SV.FALSE_START_MS + 20);
    return;
  }
  if (st.phase === 'open' && !st.wrong.includes(me.id) && pressedRound !== st.round) {
    pressedRound = st.round;
    conn.send({ t: 'buzz', id: me.id, round: st.round });
    if (navigator.vibrate) navigator.vibrate(30);
    render();
  }
}
$('#btn').addEventListener('pointerdown', press);
$('#btn').addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('keydown', (e) => { if (e.code === 'Space' && !/INPUT|TEXTAREA/.test(e.target.tagName)) press(e); });

function nameOf(id) { const p = st && st.players.find((x) => x.id === id); return p ? p.name : '?'; }

function setBtn(cls, big, small) {
  const b = $('#btn');
  b.className = cls;
  b.innerHTML = esc(big) + (small ? '<small>' + esc(small) + '</small>' : '');
}

function renderStrip() {
  const first = st.phase === 'answering' && st.buzz[0] && st.buzz[0].id;
  $('#strip').innerHTML = [...st.players].sort((a, b) => b.score - a.score).map((p) =>
    `<div class="c ${p.id === me.id ? 'me' : ''} ${p.id === first ? 'first' : ''} ${st.wrong.includes(p.id) ? 'wrong' : ''} ${p.online ? '' : 'off'}">${esc(p.name)}<b>${SV.money(p.score)}</b></div>`).join('');
}

// то, что раньше было только на большом экране: табло, вопрос, кто отвечает, ответ
function renderView() {
  const ph = st.phase, cur = st.cur;
  let h = '';
  if (ph === 'lobby') {
    h = `<div class="mid"><div class="big">Вы в игре!</div><p class="muted">Ждём, когда ведущий начнёт. Игроков: ${st.players.length}</p></div>`;
  } else if (ph === 'board') {
    h = '<div class="board">';
    st.themes.forEach((t, ti) => {
      h += `<div class="theme">${esc(t)}</div>`;
      SV.VALUES.forEach((v, i) => (h += `<div class="cell ${st.played[ti][i] ? 'played' : ''}">${v}</div>`));
    });
    h += '</div>';
    h += st.chooser === me.id ? '<p class="big gold-text">Вы выбираете вопрос!<br><span style="font-size:16px">Назовите вслух тему и цену</span></p>'
      : st.chooser ? `<p>Выбирает: <b class="gold-text">${esc(nameOf(st.chooser))}</b></p>` : '<p class="muted">Ведущий выбирает вопрос</p>';
  } else if (ph === 'cat') {
    h = `<div class="mid"><div class="sp-title">🐱 Кот в мешке!</div><div class="qh">Тема: ${esc(cur.theme)} · ${cur.value}</div>
      <p>${st.chooser === me.id ? '<b class="gold-text">Вы отдаёте этот вопрос другому игроку — скажите ведущему кому.</b>' : st.chooser ? esc(nameOf(st.chooser)) + ' отдаёт вопрос другому игроку' : 'Ведущий отдаёт вопрос'}</p></div>`;
  } else if (ph === 'auction') {
    h = `<div class="mid"><div class="sp-title">🔨 Аукцион!</div><div class="qh">${esc(cur.theme)} · номинал ${cur.value}</div>
      <p>Торгуйтесь вслух! Ставка — не меньше ${cur.value}, или ва-банк (весь ваш счёт).</p></div>`;
  } else if (cur) {
    const sp = cur.special;
    h = `<div class="mid">${sp ? '<div class="sp-title" style="font-size:18px">' + SV.specialTitle(sp) + '</div>' : ''}<div class="qh">${esc(cur.theme)} · ${sp ? 'ставка ' + sp.bet : cur.value}</div><div class="qt">${esc(cur.text)}</div>${SV.imgHtml(cur.img, conn, 'qimg', cur.imgCredit)}`;
    if (ph === 'special') h += `<div class="lbl">Отвечает</div><div class="who">${esc(nameOf(sp.to))}</div>`;
    if (ph === 'answering') {
      const rest = st.buzz.slice(1);
      h += `<div class="lbl">Отвечает</div><div class="who">${esc(nameOf(st.buzz[0].id))}</div>` +
        (rest.length ? '<div class="ord">' + rest.map((b, k) => (k + 2) + '. ' + esc(nameOf(b.id))).join(' · ') + '</div>' : '');
    }
    if (ph === 'timeout') h += '<div class="lbl" style="font-size:16px">Время вышло</div>';
    if (ph === 'reveal' && st.correct) h += `<div class="lbl">Верно ответил(а)</div><div class="who">${esc(nameOf(st.correct))}</div>`;
    if (cur.answer != null) h += `<div class="ans">Ответ: <b>${esc(cur.answer)}</b></div>`;
    h += '</div>';
  }
  $('#view').innerHTML = h;
}

function render() {
  if (!st || !mePlayer) {
    $('#myScore').textContent = '0';
    $('#info').textContent = st ? 'Входим в игру…' : 'Ищем игру… Ведущий должен открыть пульт.';
    $('#view').innerHTML = '';
    setBtn('', 'Ждите', '');
    showFinal(false);
    return;
  }
  $('#myName').textContent = mePlayer.name;
  $('#myScore').textContent = SV.money(mePlayer.score);
  if ($('#info').textContent.startsWith('Входим') || $('#info').textContent.startsWith('Ищем')) $('#info').textContent = '';
  const ph = st.phase, now = Date.now();
  $('#tbar').classList.toggle('hidden', ph !== 'open');
  renderStrip();
  if (ph.startsWith('final')) { renderFinal(); return; }
  showFinal(false);
  renderView();

  if (now < falseUntil) return setBtn('red', 'Фальстарт!', 'Рано — подождите секунду');
  switch (ph) {
    case 'lobby': return setBtn('', 'Ждём начала', '');
    case 'board': return setBtn('', 'Ждём вопрос', '');
    case 'question': return setBtn('', 'Слушайте', 'Жать — когда кнопка станет зелёной');
    case 'open':
      if (st.wrong.includes(me.id)) return setBtn('', 'Вы уже отвечали', 'На этот вопрос — всё');
      if (pressedRound === st.round) return setBtn('wait', 'Нажато!', 'Ждём…');
      return setBtn('green', 'Отвечаю!', '');
    case 'answering': {
      const pos = st.buzz.findIndex((b) => b.id === me.id);
      if (pos === 0) return setBtn('gold', 'Вы первый!', 'Отвечайте вслух!');
      return setBtn('', 'Отвечает другой', pos > 0 ? 'Вы нажали ' + (pos + 1) + '-м' : '');
    }
    case 'timeout': return setBtn('', 'Время вышло', '');
    case 'cat': return setBtn('', 'Кот в мешке', st.chooser === me.id ? 'Скажите ведущему, кому отдаёте' : 'Ждём, кому достанется');
    case 'auction': return setBtn('', 'Аукцион', 'Торгуйтесь вслух');
    case 'special': return st.cur.special.to === me.id ? setBtn('gold', 'Ваш вопрос!', 'Отвечайте вслух') : setBtn('', 'Отвечает другой', 'Кнопки сейчас не нужны');
    case 'reveal': return setBtn('', st.correct === me.id ? 'Верно!' : 'Вопрос закрыт', st.correct === me.id ? 'Вы выбираете следующий' : '');
  }
  setBtn('', '…', '');
}

// таймер на кнопке
setInterval(() => {
  if (!st || st.phase !== 'open') return;
  $('#tfill').style.width = Math.max(0, ((timerEnd - Date.now()) / SV.BUZZ_MS) * 100) + '%';
}, 150);

// ----- финал -----
function showFinal(on) {
  $('#final').classList.toggle('hidden', !on);
  $('#btnWrap').classList.toggle('hidden', on);
  $('#view').classList.toggle('hidden', on);
  if (!on) finalKey = '';
}
function renderFinal() {
  showFinal(true);
  const F = st.final, ph = st.phase;
  const inFinal = F.eligible.includes(me.id);
  const betDone = F.betDone.includes(me.id), ansDone = F.ansDone.includes(me.id);
  // перерисовываем только при смене этапа, чтобы не стирать то, что игрок печатает
  const key = [ph, inFinal, betDone, ansDone, ph === 'final_bets' ? mePlayer.score : ''].join('|');
  if (key === finalKey) return;
  finalKey = key;
  const el = $('#final');
  if (!inFinal) {
    el.innerHTML = ph === 'final_results' ? resultsHtml()
      : F.text ? `<h2>Финал · ${esc(F.theme)}</h2><p class="q">${esc(F.text)}</p><p class="note">${ph === 'final_judge' ? 'Ведущий проверяет ответы…' : 'Вы болельщик: в финале играют участники с плюсом на счету.'}</p>`
      : `<h2>Финал · ${esc(F.theme)}</h2><p class="q">В финале играют участники с плюсом на счету.</p><p class="note">Они делают ставки. Болейте!</p>`;
    return;
  }
  if (ph === 'final_bets') {
    const max = Math.max(1, mePlayer.score);
    el.innerHTML = `<h2>Тема: ${esc(F.theme)}</h2>
      <p>Ваш счёт: <b class="gold-text">${SV.money(mePlayer.score)}</b>.<br>Ставка — от 1 до ${max}.</p>
      ${betDone ? '<p class="gold-text" style="font-size:22px">Ставка принята' + (myBet != null ? ': ' + myBet : '') + '. Можно изменить, пока ведущий не показал вопрос.</p>' : ''}
      <input id="inBet" type="number" inputmode="numeric" min="1" max="${max}" placeholder="Ставка" value="${myBet != null ? myBet : ''}" />
      <button class="gold" id="sendBet">${betDone ? 'Изменить ставку' : 'Сделать ставку'}</button>
      <button id="allIn">Ва-банк (${max})</button>`;
    const send = (v) => {
      v = Math.round(Number(v));
      if (!(v >= 1 && v <= max)) { alert('Ставка должна быть от 1 до ' + max); return; }
      myBet = v; finalKey = '';
      conn.send({ t: 'bet', id: me.id, amount: v });
    };
    $('#sendBet').onclick = () => send($('#inBet').value);
    $('#allIn').onclick = () => send(max);
  } else if (ph === 'final_question') {
    el.innerHTML = `<h2>${esc(F.theme)}</h2><p class="q">${esc(F.text)}</p>
      ${ansDone ? '<p class="gold-text">Ответ отправлен. Можно исправить, пока ведущий не закрыл приём.</p>' : ''}
      <textarea id="inAns" maxlength="200" placeholder="Ваш ответ"></textarea>
      <button class="gold" id="sendAns">${ansDone ? 'Исправить ответ' : 'Отправить ответ'}</button>`;
    const saved = store.get('svoya_fans_' + room + '_' + me.id, '');
    $('#inAns').value = saved;
    $('#sendAns').onclick = () => {
      const t = $('#inAns').value.trim();
      if (!t) return;
      store.set('svoya_fans_' + room + '_' + me.id, t);
      finalKey = '';
      conn.send({ t: 'fans', id: me.id, text: t });
    };
  } else if (ph === 'final_judge') {
    el.innerHTML = `<h2>Ответы приняты</h2><p class="q">Ведущий проверяет ответы…</p>`;
  } else {
    el.innerHTML = resultsHtml();
  }
}
function resultsHtml() {
  const F = st.final;
  const r = (F.results || []).find((x) => x.id === me.id);
  const sorted = [...st.players].sort((a, b) => b.score - a.score);
  const place = sorted.findIndex((p) => p.id === me.id) + 1;
  return `<h2>Итоги</h2>
    <p class="q">Правильный ответ: <b class="gold-text">${esc(F.answer || '')}</b></p>
    ${r ? `<p style="font-size:26px;color:${r.ok ? '#8dffb9' : '#ffb3b0'}">${r.ok ? 'Верно! +' + r.bet : 'Неверно −' + r.bet}</p>` : ''}
    <p style="font-size:24px">Ваш счёт: <b class="gold-text">${SV.money(mePlayer.score)}</b><br>Место: <b>${place}</b> из ${sorted.length}</p>
    ${sorted[0] ? '<p class="note">Победитель</p><p style="font-size:30px;font-weight:900" class="gold-text">' + esc(sorted[0].name) + '</p>' : ''}
    ${(F.results || []).map((x) => `<p style="margin:4px 0">${esc(nameOf(x.id))}: «${esc(x.answer) || '—'}» <b style="color:${x.ok ? '#8dffb9' : '#ffb3b0'}">${x.ok ? '+' : '−'}${x.bet}</b></p>`).join('')}`;
}
</script>
</body>
</html>
